# Coturn — relay para quem está em rede que bloqueia conexão direta (4G, hotel).
# O segredo NÃO fica aqui (arquivo público): o entrypoint do compose junta
# `static-auth-secret=` numa cópia 600 dentro do container, a partir do midia.env.
listening-port=3478
listening-ip=62.72.11.28
relay-ip=62.72.11.28
external-ip=62.72.11.28
realm=escritorio.healthsafetytech.com
use-auth-secret
fingerprint
min-port=49160
max-port=49200
no-tls
no-dtls
no-multicast-peers
no-tcp-relay

# ⚠️ Esta VPS hospeda os bancos da empresa. Sem estas linhas, qualquer pessoa
# com credencial de TURN usa o relay para alcançar 172.18.0.1, os containers
# e o loopback. testes/testar-config.sh exige cada uma.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# O IP público do próprio host também é "dentro" — tudo que escuta em 0.0.0.0
# na VPS. E CGNAT, benchmark e os equivalentes IPv6.
denied-peer-ip=62.72.11.28
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
