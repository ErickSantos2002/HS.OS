# Faz o roteamento por caminho que o Traefik do Compose oficial fazia por
# labels. O EasyPanel só aponta os dois domínios para cá (porta 80); TLS fica
# com o Traefik dele, que manda X-Forwarded-Proto.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# DNS do Docker, consultado a cada request. Com nome literal no proxy_pass o
# nginx guarda o IP do boot: um deploy que recrie o play sem recriar a borda
# deixaria o escritório dando 502. Por isso os upstreams vão em variável.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name escritoriohs.healthsafetytech.com;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    # ⚠️ O /openid-callback do play responde com cabeçalho grande (cookie e
    # redirecionamento com os tokens do Entra). Com o buffer padrão (4–8k) o
    # nginx dava "upstream sent too big header" → 502, e o Traefik mostrava
    # "Service is not reachable": metade dos logins em 15/10/2026.
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;

    set $play        play;
    set $back        back;
    set $uploader    uploader;
    set $icon        icon;
    set $map_storage map-storage;

    # ⚠️ No WA v1.33.11 o upload de áudio do uploader NÃO exige autenticação, e
    # os arquivos vão para o redis: aberto, qualquer um na internet enche a RAM
    # da VPS dos bancos. Não usamos chat com upload (ENABLE_CHAT_UPLOAD=false).
    location /uploader/upload-audio-message { return 403; }

    # Com variável no proxy_pass a barra final não tira mais o prefixo: o
    # rewrite faz o papel do stripprefix do Traefik.
    location /api/         { rewrite ^/api/(.*)$ /$1 break;         proxy_pass http://$back:8080; }
    location /uploader/    { client_max_body_size 10m;
                             rewrite ^/uploader/(.*)$ /$1 break;    proxy_pass http://$uploader:8080; }
    location /icon/        { rewrite ^/icon/(.*)$ /$1 break;        proxy_pass http://$icon:8080; }
    location /lettericons  { proxy_pass http://$icon:8080; }
    location /map-storage/ { rewrite ^/map-storage/(.*)$ /$1 break; proxy_pass http://$map_storage:3000; }
    location /ws/          { proxy_pass http://$play:3001; }
    location /             { proxy_pass http://$play:3000; }
}

server {
    listen 80;
    server_name livekit.healthsafetytech.com;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;

    # LiveKit no host, pela bridge do Swarm (validado em 15/10/2026). IP
    # literal: não passa pelo resolver.
    location / { proxy_pass http://172.18.0.1:7880; }
}
