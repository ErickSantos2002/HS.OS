services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hsos-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: hsos-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
