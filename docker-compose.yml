services:
  backend:
    build:
      # Raiz, não `backend/`: a imagem precisa levar `skills/` junto.
      context: .
      dockerfile: backend/Dockerfile
      dockerfile: Dockerfile
    container_name: hsos-backend
    # 8002 no host: 8000 é do taskhs-backend e 8001 do gestorhs-backend.
    ports:
      - "8002:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: hsos-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
