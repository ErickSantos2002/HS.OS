server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Não há proxy /api aqui: em produção a API fica em outro domínio
    # (hsosapi.healthsafetytech.com) e o navegador fala direto com ela — quem
    # autoriza é o CORS do backend. O equivalente em desenvolvimento é o proxy
    # do Vite, em vite.config.ts.

    # SPA fallback — todas as rotas que não são arquivo caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O service worker não pode ser cacheado, senão o app trava numa versão
    # antiga e o aviso de "nova versão disponível" nunca aparece.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # index.html também não: é ele que aponta para os assets com hash novo.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets têm hash no nome, então podem ser cacheados agressivamente.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
