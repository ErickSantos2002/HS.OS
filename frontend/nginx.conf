server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API — o front chama /api/... e o nginx repassa para o backend.
    # É o que permite VITE_API_URL=/api (mesma origem, sem CORS no browser).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade para WebSocket (substituto do realtime do Supabase)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Turnos de agente são longos — não derrube a conexão cedo demais.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback — todas as rotas que não são arquivo caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O service worker não pode ser cacheado, senão o app trava numa versão.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
